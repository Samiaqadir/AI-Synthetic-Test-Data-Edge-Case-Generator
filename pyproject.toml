[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "samia"
version = "0.1.0"
description = "AI Synthetic Test Data & Edge-Case Generator with Relational DAG Resolution & Adversarial Stress Testing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Samia Team"}
]
dependencies = [
    "sqlparse>=0.4.4",
    "Faker>=20.0.0",
    "pydantic>=2.5.0",
    "click>=8.1.0",
    "PyYAML>=6.0.1",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0"
]

[project.scripts]
samia = "samia.cli:main"

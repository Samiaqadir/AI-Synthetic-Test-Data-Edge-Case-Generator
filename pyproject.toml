[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samia"
version = "0.1.0"
description = "AI Synthetic Test Data & Edge-Case Generator with Relational DAG Resolution & Adversarial Stress Testing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Samia Qadir", email = "samiaqadir@users.noreply.github.com" }
]
keywords = [
    "synthetic-data",
    "test-data-generator",
    "edge-cases",
    "adversarial-testing",
    "sql-ddl",
    "json-schema",
    "pydantic",
    "faker",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Database",
    "Topic :: Security",
]
dependencies = [
    "sqlparse>=0.4.4",
    "Faker>=20.0.0",
    "pydantic>=2.5.0",
    "click>=8.1.0",
    "PyYAML>=6.0.1",
    "rich>=13.7.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "build>=1.0.0",
    "wheel",
]

[project.urls]
Homepage = "https://github.com/Samiaqadir/AI-Synthetic-Test-Data-Edge-Case-Generator"
Repository = "https://github.com/Samiaqadir/AI-Synthetic-Test-Data-Edge-Case-Generator"
Issues = "https://github.com/Samiaqadir/AI-Synthetic-Test-Data-Edge-Case-Generator/issues"

[project.scripts]
samia = "samia.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["samia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

name: CI - Test & Packaging Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade Pip and Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Package in Editable Mode
        run: |
          pip install -e .

      - name: Verify CLI Entrypoint
        run: |
          samia --version
          samia --help

      - name: Run Test Suite with Pytest
        run: |
          pytest -v --tb=short

      - name: Run End-to-End Pipeline Smoke Test
        run: |
          python run_pipeline.py
          samia generate --schema-sql examples/ecommerce_pipeline.sql --mode happy --count 10

  build-distributions:
    name: Build Source Distribution & Wheels
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build & Validation Tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Validate Built Artifacts
        run: |
          twine check dist/*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
